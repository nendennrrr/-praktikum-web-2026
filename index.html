<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aplikasi To-Do List - Modul 5</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="todo-app">
    <h2>Daftar Tugas Saya</h2>

    <!-- Fitur 1: Task Counter Summary -->
    <div class="task-counter" id="taskCounter">
      Total: 0 Tugas | Selesai: 0 | Belum Selesai: 0
    </div>

    <!-- Form Input Tugas -->
    <form id="todoForm" novalidate>
      <div class="input-section">
        <input type="text" id="taskInput" placeholder="Ketikkan tugas baru Anda...">
        <button type="submit" class="add-btn">Tambah</button>
      </div>
      <div class="error-message" id="inputError">Tugas minimal harus 3 karakter.</div>
      <div class="error-message" id="inputMaks"></div>
    </form>

    <!-- Daftar Tugas -->
    <ul class="todo-list" id="todoList"></ul>

    <!-- Fitur 2: Tombol Bersihkan Tugas Selesai -->
    <div class="actions-section">
      <button id="clearCompletedBtn" class="clear-btn">Bersihkan Tugas Selesai</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
